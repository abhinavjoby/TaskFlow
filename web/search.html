<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <main class="content-view">
            <header class="view-header">
                <div class="header-left">
                    <h1>Good Afternoon!</h1>
                    <p class="timestamp">2:41 Mon 9 Mar</p>
                </div>

                <nav class="glass-nav-inline">
                    <div class="nav-container">
                        <a href="/index.html" class="nav-item">main</a>
                        <a href="/calendar.html" class="nav-item">calender</a>
                        <a href="/search.html" class="nav-item active">search</a>
                    </div>
                </nav>

                <div class="header-right">
                    <div class="new-btn">+</div>
                </div>
            </header>

            <div class="search-main-zone">
    <div class="infinite-scroll-container">
        <div class="subject-track">
            <div class="wire-card subject-card"></div>
            <div class="wire-card subject-card"></div>
            <div class="wire-card subject-card"></div>
            <div class="wire-card subject-card"></div>
            <div class="wire-card subject-card"></div>
            <div class="wire-card subject-card"></div>
            <div class="wire-card subject-card"></div>
        </div>
    </div>

    <div class="bottom-search-wrapper">
        <input type="text" class="search-input" placeholder="Start typing...">
    </div>
</div>
        </main>

        <aside class="sidebar-urgent">
            <div class="sidebar-fixed-top">
                <div class="top-row">
                    <div class="focus-trigger">focus mode</div>
                    <div class="user-avatar"></div>
                </div>
                <h2>Urgent tasks</h2>
                <div class="filter-pills">
                    <span class="pill"></span><span class="pill"></span><span class="pill"></span><span class="pill white"></span>
                </div>
            </div>

            <div class="sidebar-scroll-area">
                <div class="urgent-stack">
                    <div class="wire-card mesh-gradient"></div>
                    <div class="wire-card"></div>
                    <div class="wire-card"></div>
                    <div class="wire-card"></div>
                    <div class="wire-card"></div>
                    <div class="wire-card"></div>
                </div>
            </div>
        </aside>
    </div>

    <script src="/eel.js"></script>
</body>
</html>

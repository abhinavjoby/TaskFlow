<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow - Analytics</title>
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="text/javascript" src="/eel.js"></script>
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background-image: var(--bgImage);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            transition: background-image 0.5s ease-in-out;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }

        .back-btn {
            background: var(--glassAColor);
            color: var(--textPrimary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            backdrop-filter: blur(10px);
            font-size: 1.2rem;
            box-shadow: var(--glassAShadow);
            border: none;
            cursor: pointer;
        }

        .brand-title {
            font-size: 2rem;
            color: var(--textPrimary);
        }

        .profile-btn-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e09c1c;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            font-size: 1.2rem;
            display: none;
        }

        .stats-container {
            flex: 1;
            padding: 0 10vw 40px 10vw;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            overflow-y: auto;
        }

        .stats-container::-webkit-scrollbar {
            display: none;
        }

        .stat-card {
            background: var(--glassBColor);
            backdrop-filter: blur(var(--glassBlur));
            -webkit-backdrop-filter: blur(var(--glassBlur));
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 0.9rem;
            color: var(--textPrimary);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Grid spans */
        .card-ml {
            grid-column: 1 / 3;
            grid-row: 1 / 3;
        }

        .card-focus-bar {
            grid-column: 3 / 5;
            grid-row: 2 / 4;
        }

        .card-focus-line {
            grid-column: 1 / 3;
            grid-row: 3 / 4;
        }

        .card-summary {
            grid-column: 3 / 4;
            grid-row: 1 / 2;
        }

        .card-analytics {
            grid-column: 4 / 5;
            grid-row: 1 / 2;
        }

        /* ML Insights */
        .insight-item {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .insight-icon {
            font-size: 1.2rem;
            margin-top: 2px;
        }

        .insight-text {
            font-size: 0.95rem;
            color: var(--textPrimary);
            line-height: 1.4;
        }

        /* Summary card */
        .summary-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .summary-val {
            font-size: 2.2rem;
            color: var(--textPrimary);
            line-height: 1;
        }

        .summary-label {
            font-size: 0.7rem;
            color: var(--textSecondary);
            margin-top: 5px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
            align-items: center;
        }

        /* Bar Chart */
        .bar-chart-container {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            padding: 0 10px;
            position: relative;
            margin-bottom: 20px;
        }

        .chart-bar-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 35px;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            border-radius: 6px;
            transition: height 0.8s cubic-bezier(.4, 0, .2, 1);
        }

        .bar-label {
            font-size: 0.7rem;
            color: var(--textPrimary);
        }

        /* Filter Pills */
        .chart-filters {
            display: flex;
            gap: 15px;
            margin-top: auto;
        }

        .filter-pill {
            font-size: 0.7rem;
            color: var(--textSecondary);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 15px;
            transition: all 0.2s;
        }

        .filter-pill.active {
            background: rgba(0, 0, 0, 0.1);
            color: var(--textPrimary);
        }

        [data-theme="dark"] .filter-pill.active {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Line Chart */
        .line-chart-wrap {
            flex: 1;
            display: flex;
            flex-direction: row;
            align-items: stretch;
            padding-top: 10px;
        }

        .y-axis-line {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.6rem;
            color: var(--textSecondary);
            margin-right: 10px;
            padding: 5px 0;
        }

        .line-chart-svg {
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        /* Analytics mini */
        .analytics-text {
            font-size: 0.85rem;
            color: var(--textSecondary);
            line-height: 1.5;
            flex: 1;
        }
    </style>
    <script>
        let savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>

<body>
    <div class="top-bar">
        <a href="index.html" class="back-btn sfMed">←</a>
    </div>

    <div class="stats-container">
        <!-- ML Insights -->
        <div class="stat-card card-ml">
            <div class="card-title sfMed">✦ ML insights</div>
            <div id="mlInsightsContainer" style="overflow-y: auto; flex:1;">
                <div class="sfReg" style="color:var(--textSecondary); font-size:0.9rem;">Loading AI insights...</div>
            </div>
        </div>

        <!-- Activity Summary -->
        <div class="stat-card card-summary">
            <div class="card-title sfMed">✳ Summary</div>
            <div class="summary-grid" id="summaryGrid">
                <div class="summary-stat">
                    <div class="summary-val instSerif" id="sumHours">--</div>
                    <div class="summary-label sfReg">hours focused</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-val instSerif" id="sumScore">--</div>
                    <div class="summary-label sfReg">avg score</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-val instSerif" id="sumSessions">--</div>
                    <div class="summary-label sfReg">sessions</div>
                </div>
                <div class="summary-stat">
                    <div class="summary-val instSerif" id="sumCompletion">--%</div>
                    <div class="summary-label sfReg">tasks done</div>
                </div>
            </div>
        </div>

        <!-- AI Analytics (Now Best Subject) -->
        <div class="stat-card card-analytics">
            <div class="card-title sfMed">✦ Best time to study</div>
            <div class="analytics-text sfReg" id="analyticsText">Loading...</div>
        </div>

        <!-- Focus Line Chart -->
        <div class="stat-card card-focus-line" style="position: relative;">
            <div class="card-title sfMed">✦ Focus by time</div>
            <div class="line-chart-wrap">
                <div class="y-axis-line sfReg">
                    <span>100</span>
                    <span>75</span>
                    <span>50</span>
                    <span>25</span>
                </div>
                <div style="flex:1; position: relative;">
                    <svg id="lineChartSvg" class="line-chart-svg" viewBox="0 0 100 50" preserveAspectRatio="none">
                        <!-- JS will draw the path -->
                    </svg>
                </div>
            </div>
        </div>

        <!-- Focus Bar Chart (subject-wise) -->
        <div class="stat-card card-focus-bar">
            <div class="card-title sfMed">✳ Subject-wise focus</div>

            <div class="bar-chart-container" id="barChartContainer">
                <!-- JS will populate bars -->
            </div>

            <div class="chart-filters sfMed">
                <div class="filter-pill" data-period="all" onclick="switchPeriod('all', this)">All-time</div>
                <div class="filter-pill active" data-period="month" onclick="switchPeriod('month', this)">Month</div>
                <div class="filter-pill" data-period="week" onclick="switchPeriod('week', this)">Week</div>
            </div>
        </div>

    </div>

    <script type="text/javascript" src="/eel.js"></script>
    <script src="js/dashboard.js"></script>
    <script>
        let currentPeriod = 'month';

        async function loadStats(period) {
            if (!window.eel) return;
            const data = await eel.get_focus_stats(period)();

            // Summary
            document.getElementById('sumHours').innerText = data.all_time_summary.total_hours;
            document.getElementById('sumScore').innerText = data.all_time_summary.avg_focus_score;
            document.getElementById('sumSessions').innerText = data.all_time_summary.total_sessions;
            document.getElementById('sumCompletion').innerText = data.all_time_summary.completion_pct + '%';

            // Line chart
            renderLineChart(data.timeline);

            // Bar chart
            renderBarChart(data.subjects);
        }

        function renderLineChart(timeline) {
            const svg = document.getElementById('lineChartSvg');
            if (!timeline || timeline.length === 0) {
                svg.innerHTML = '<text x="50" y="25" text-anchor="middle" fill="var(--textSecondary)" font-size="4">No data</text>';
                return;
            }

            const n = timeline.length;
            const padding = 2;
            const w = 100 - padding * 2;
            const h = 50 - padding * 2;

            // Map scores to coordinates
            const points = timeline.map((d, i) => {
                const x = padding + (i / Math.max(n - 1, 1)) * w;
                const y = padding + h - (d.score / 100) * h;
                return { x, y, score: d.score, date: d.date };
            });

            // Build smooth path using cubic bezier
            let pathD = `M${points[0].x},${points[0].y}`;
            for (let i = 1; i < points.length; i++) {
                const prev = points[i - 1];
                const curr = points[i];
                const cpx1 = prev.x + (curr.x - prev.x) * 0.4;
                const cpx2 = curr.x - (curr.x - prev.x) * 0.4;
                pathD += ` C${cpx1},${prev.y} ${cpx2},${curr.y} ${curr.x},${curr.y}`;
            }

            // Gradient fill path
            const lastPt = points[points.length - 1];
            const firstPt = points[0];
            let fillD = pathD + ` L${lastPt.x},${padding + h} L${firstPt.x},${padding + h} Z`;

            svg.innerHTML = `
                <defs>
                    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="var(--accentBlue)" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="var(--accentBlue)" stop-opacity="0.02"/>
                    </linearGradient>
                </defs>
                <path d="${fillD}" fill="url(#lineGrad)" />
                <path d="${pathD}" fill="none" stroke="var(--accentBlue)" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="${lastPt.x}" cy="${lastPt.y}" r="1.5" fill="var(--accentBlue)"/>
            `;
        }

        function renderBarChart(subjects) {
            const container = document.getElementById('barChartContainer');
            if (!subjects || subjects.length === 0) {
                container.innerHTML = '<div class="sfReg" style="color:var(--textSecondary); text-align:center; width:100%;">No data</div>';
                return;
            }

            let html = '';
            subjects.forEach(s => {
                const heightPct = Math.max(5, s.avg_focus);
                html += `
                    <div class="chart-bar-group">
                        <div class="bar" style="height: ${heightPct}%; background: ${s.color};"></div>
                        <div class="bar-label sfReg">${s.name}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function switchPeriod(period, el) {
            currentPeriod = period;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            loadStats(period);
        }

        // ML Insights
        async function loadMLInsights() {
            if (!window.eel) return;
            const data = await eel.get_ml_insights()();
            const container = document.getElementById('mlInsightsContainer');
            const analyticsEl = document.getElementById('analyticsText');

            if (data.error) {
                container.innerHTML = `<div class="sfReg" style="color:var(--textSecondary); font-size:0.9rem;">${data.error}</div>`;
                analyticsEl.innerText = data.error;
                return;
            }

            let html = '<ul style="display:flex; flex-direction:column; justify-content:space-evenly; height:100%; margin: 0; padding-left: 20px;" class="sfReg">';
            if (data.insights) {
                data.insights.forEach(ins => {
                    html += `<li style="margin-bottom: 15px;"><strong>${ins.title}</strong>: ${ins.text}</li>`;
                });
            }
            html += '</ul>';
            container.innerHTML = html;

            // Analytics card — Best subject to study now
            let analyticsHtml = '';
            if (data.recommendations && data.recommendations.length > 0) {
                data.recommendations.slice(0, 3).forEach((rec, idx) => {
                    const medals = ['🥇', '🥈', '🥉'];
                    analyticsHtml += `
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:5px;">
                        <div>
                            <span style="font-size:1.1rem; margin-right:5px;">${medals[idx]}</span>
                            <strong style="color:var(--textPrimary);">${rec[0]}</strong>
                        </div>
                        <div style="text-align:right;">
                            <span style="color:var(--pillColor7); font-weight:600;">${rec[2]}/100</span><br>
                            <span style="font-size:0.7rem; color:var(--textSecondary);">${rec[1]}</span>
                        </div>
                    </div>`;
                });
            } else {
                analyticsHtml = '<div class="sfReg" style="color:var(--textSecondary);">Need more data...</div>';
            }
            analyticsEl.innerHTML = analyticsHtml;
        }

        // Init when eel is ready
        window.addEventListener('load', () => {
            setTimeout(() => {
                if (window.eel) {
                    loadStats('month');
                    loadMLInsights();
                }
            }, 200);
        });
    </script>
</body>

</html>

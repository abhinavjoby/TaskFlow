<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskflow - Notes</title>
    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <script type="text/javascript" src="/eel.js"></script>
    <style>
        body {
            height: 100vh;
            overflow: hidden;
            background-image: var(--bgImage);
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            transition: background-image 0.5s ease-in-out;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
        }

        .back-btn {
            background: var(--glassAColor);
            color: var(--textPrimary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            backdrop-filter: blur(10px);
            font-size: 1.2rem;
            box-shadow: var(--glassAShadow);
            border: none;
            cursor: pointer;
        }

        .brand-title {
            font-size: 2rem;
            color: var(--textPrimary);
        }

        .profile-btn-circle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #e09c1c; /* Gold */
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            font-size: 1.2rem;
        }

        .notes-container {
            flex: 1;
            padding: 20px 10vw 80px 10vw;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            overflow-y: auto;
        }

        .notes-container::-webkit-scrollbar {
            display: none;
        }

        .note-card {
            background: var(--glassBColor);
            backdrop-filter: blur(var(--glassBlur));
            -webkit-backdrop-filter: blur(var(--glassBlur));
            border-radius: 25px;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .note-card:hover {
            transform: scale(1.02);
        }

        .note-text {
            color: #e09c1c; /* Gold color matching image */
            font-size: 1rem;
        }
    </style>
    <script>
        let savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>
    <div class="top-bar">
        <a href="index.html" class="back-btn sfMed">←</a>
        <div class="brand-title instSerif">taskflow</div>
        <div class="profile-btn-circle sfMed">👤</div>
    </div>

    <div class="notes-container" id="notesGrid">
        <!-- Will be populated by JS -->
    </div>

    <script>
        async function loadNotes() {
            if (window.eel) {
                const allTasks = await eel.get_all_tasks()();
                const allNotes = await eel.get_all_notes()();
                
                let notesHtml = '';
                
                // Add global notes
                if (allNotes && allNotes.length > 0) {
                    allNotes.forEach(note => {
                        if (note.content && note.content.trim()) {
                            notesHtml += `<div class="note-card">
                                <div class="note-text sfMed">${note.content} <br><br> <span style="font-size:0.8em; opacity:0.6;">#${new Date(note.timestamp).toLocaleDateString()}</span></div>
                            </div>`;
                        }
                    });
                }

                // Add task notes
                if (allTasks) {
                    allTasks.forEach(t => {
                        if (t.notes && t.notes.length > 0) {
                            t.notes.forEach(note => {
                                if (note && note.trim()) {
                                    notesHtml += `<div class="note-card">
                                        <div class="note-text sfMed">${note.substring(0, 100)}${note.length > 100 ? '...' : ''} <br><br> <span style="font-size:0.8em; opacity:0.6;">#${new Date(t.created_at).toLocaleDateString()} - ${t.subject}</span></div>
                                    </div>`;
                                }
                            });
                        }
                    });
                }
                
                // Placeholder if empty
                if (!notesHtml) {
                    notesHtml = `<div class="sfMed" style="color:var(--textSecondary); grid-column: 1 / -1; text-align:center;">No notes created yet.</div>`;
                }
                
                document.getElementById('notesGrid').innerHTML = notesHtml;
            } else {
                let mock = '';
                for(let i=0; i<15; i++) {
                    mock += `<div class="note-card"><div class="note-text sfMed">My note #datetime</div></div>`;
                }
                document.getElementById('notesGrid').innerHTML = mock;
            }
        }
        
        window.addEventListener('load', () => {
            setTimeout(loadNotes, 200);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="app-layout">
        <main class="content-view">
            <!-- Default header and navigation for all pages -->
            <header class="view-header">
                <div class="header-left">
                    <h1>Good Afternoon!</h1>
                    <p class="timestamp">2:41 Mon 9 Mar</p>
                </div>
                <nav class="glass-nav-inline">
                    <div class="nav-container">
                        <a href="/index.html" class="nav-item">main</a>
                        <a href="/calendar.html" class="nav-item active">calendar</a>
                        <a href="/search.html" class="nav-item">search</a>
                    </div>
                </nav>
                <div class="header-right">
                    <div class="new-btn">+</div>
                </div>
            </header>
            <!-- Calendar-specific content -->
            <div class="calendar-scroll-container">
                <div class="calendar-grid">
                    <div class="day-column">
                        <div class="day-label">SUN <span>08</span></div>
                        <div class="task-zone">
                        
                        </div>
                    </div>
                    <div class="day-column">
                        <div class="day-label">MON <span>09</span></div>
                        <div class="task-zone">
                            
                        </div>
                    </div>
                    <div class="day-column">
                        <div class="day-label">TUE <span>10</span></div>
                        <div class="task-zone">
                            
                        </div>
                    </div>
                    <div class="day-column"><div class="day-label">WED <span>11</span></div><div class="task-zone"></div></div>
                    <div class="day-column"><div class="day-label">THU <span>12</span></div><div class="task-zone"></div></div>
                    <div class="day-column"><div class="day-label">FRI <span>13</span></div><div class="task-zone"></div></div>
                    <div class="day-column"><div class="day-label">SAT <span>14</span></div><div class="task-zone"></div></div>
                </div>
            </div>
        </main>
        <!-- Urgent tasks sidebar, consistent across all pages -->
        <aside class="sidebar-urgent">
            <div class="sidebar-fixed-top">
                <div class="top-row">
                    <div class="focus-trigger">focus mode</div>
                    <div class="user-avatar"></div>
                </div>
                <h2>Urgent tasks</h2>
                <div class="filter-pills">
                    <span class="pill"></span>
                    <span class="pill"></span>
                    <span class="pill"></span>
                    <span class="pill white"></span>
                </div>
            </div>

            <div class="sidebar-scroll-area">
                <div class="urgent-stack">
                    <div class="wire-card mesh-gradient"></div>
                    <div class="wire-card"></div>
                    <div class="wire-card"></div>
                    <div class="wire-card"></div>
                    <div class="wire-card"></div>
                    <div class="wire-card"></div>
                </div>
            </div>
        </aside>
    </div>
</body>
</html>
